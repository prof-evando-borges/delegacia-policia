# Perfil usado apenas no GitHub Actions (Oracle descartavel em container).
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=delegacia
spring.datasource.password=delegacia

# Executa os scripts dos modulos na ordem de dependencia antes de validar as entidades.
# "optional:" permite que o build passe enquanto um modulo ainda nao entregou o script.
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=\
  optional:classpath:banco-de-dados/01-policiais.sql,\
  optional:classpath:banco-de-dados/02-fichas.sql,\
  optional:classpath:banco-de-dados/03-folha.sql,\
  optional:classpath:banco-de-dados/04-estoque.sql,\
  optional:classpath:banco-de-dados/05-chamadas.sql,\
  optional:classpath:banco-de-dados/06-rondas.sql,\
  optional:classpath:banco-de-dados/07-boletins.sql,\
  optional:classpath:banco-de-dados/08-patio.sql,\
  optional:classpath:banco-de-dados/09-prisoes.sql

spring.jpa.show-sql=false
